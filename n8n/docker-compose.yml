services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    ports:
    # Port on Host System:Port inside Docker (default for n8n)
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - GENERIC_TIMEZONE=Europe/Berlin
      - N8N_BLOCK_PRIVATE_IPS=false
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      # Allows the n8n container to reach your .NET app running on the Linux host
      - "host.docker.internal:host-gateway"

volumes:
  n8n_data:
